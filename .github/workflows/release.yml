# Release build, triggered by a v* tag.
#
# Builds the PyInstaller sidecar and the bundled, signed Tauri installers on Linux and
# Windows and uploads them to a draft GitHub release together with the updater manifest.
#
# No test suite runs here: pytest, coverage and `cargo test` are Linux-only and already
# ran in ci.yml. max-parallel: 1 is required because tauri-action rewrites latest.json
# read-merge-delete-upload; parallel platforms would drop each other's entries.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Refuse placeholder updater configuration
        shell: bash
        env:
          PLACEHOLDER_PUBKEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDFDMjBCQTkyMDVCRTM4QzYKUldUR09MNEZrcm9nSEIzSzJJTjlmNUJNeWpseFRKSmVIUjNWTGFwcDVZVnU0YVhoYktleFZDNDEK
        run: |
          config=src-tauri/tauri.conf.json
          if jq -e '.plugins.updater.endpoints[] | select(contains("OWNER/REPO"))' "$config" > /dev/null; then
            echo "The updater endpoints still point at OWNER/REPO. Set the real repository before tagging a release." >&2
            exit 1
          fi
          if [ "$(jq -r '.plugins.updater.pubkey' "$config")" = "$PLACEHOLDER_PUBKEY" ]; then
            echo "The updater pubkey is still the throwaway placeholder key. Generate a real signing key pair, store the private key in TAURI_SIGNING_PRIVATE_KEY and put its public key into tauri.conf.json before tagging a release." >&2
            exit 1
          fi
      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(sed -n '/^\[project\]/,/^\[build-system\]/{s/^version = "\(.*\)"$/\1/p}' pyproject.toml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the pyproject version $version; expected v$version." >&2
            exit 1
          fi
          crate_version=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' src-tauri/Cargo.toml)
          if [ "$crate_version" != "$version" ]; then
            echo "The desktop crate version $crate_version does not match the pyproject version $version; the bundled app would report a different version than the core it ships." >&2
            exit 1
          fi
          if jq -e 'has("version")' src-tauri/tauri.conf.json > /dev/null; then
            echo "src-tauri/tauri.conf.json declares a version key; it would override Cargo.toml and become a second source of truth. Remove it before tagging a release." >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev --group build
      - run: uv run pyinstaller packaging/sptmod.spec --noconfirm --distpath src-tauri/sidecar --workpath packaging/build
      - name: Smoke test the frozen CLI
        shell: bash
        run: |
          binary=src-tauri/sidecar/sptmod/sptmod
          if [ "$RUNNER_OS" = "Windows" ]; then
            binary="$binary.exe"
          fi
          "$binary" version
          echo '{}' | "$binary" rpc list_directories
          mkdir -p smoke/game/SPT_Runtime smoke/game/BepInEx/plugins
          git -C smoke/game init -q
          git -C smoke/game config sptmod.sptversion 4.1.0
          echo '{"path":"smoke/game","query":"","db_path":"smoke/catalog.sqlite3"}' \
            | "$binary" rpc search_catalog
          rm -rf smoke
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'sptmod __VERSION__'
          releaseDraft: true
          prerelease: false
          # Adds the PyInstaller sidecar as a bundle resource; it is declared in an
          # overlay so that a checkout without src-tauri/sidecar still compiles.
          args: -c src-tauri/tauri.bundle.conf.json
