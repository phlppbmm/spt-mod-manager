[project]
name = "sptmod"
version = "0.1.0"
description = "Mod manager for SPT (Single Player Tarkov)"
readme = "README.md"
authors = [
    { name = "Philipp Baumm", email = "philipp.baumm@gmx.de" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "platformdirs>=4.11.7",
    "psutil>=7.2.2",
    "pydantic>=2.13.1",
    "py7zr>=1.1.3",
    "rarfile>=4.5",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
sptmod = "sptmod.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 5

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
# rarfile ships no py.typed marker and no stub package exists on PyPI.
module = "rarfile"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
    "types-psutil>=7.2.2.20260827",
]

[tool.coverage.run]
branch = true
source = ["sptmod"]

[tool.coverage.report]
# Only two exclusion classes are allowed in this project: platform-specific
# branches that cannot execute on Linux and static-typing-only imports.
exclude_also = [
    'if sys\.platform == "win32":',
    "if TYPE_CHECKING:",
]
fail_under = 100
show_missing = true
