[project]
name = "sptmod"
version = "0.1.0"
description = "Mod manager for SPT (Single Player Tarkov)"
readme = "README.md"
authors = [
    { name = "Philipp Baumm", email = "philipp.baumm@gmx.de" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "platformdirs>=4.11.7",
    "psutil>=7.2.2",
    "pydantic>=2.13.1",
    "py7zr>=1.1.3",
    "rarfile>=4.5",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
sptmod = "sptmod.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 5

[tool.ruff]
line-length = 119
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
# rarfile ships no py.typed marker and no stub package exists on PyPI.
module = "rarfile"
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
# Strict-mode rules that are reachable without cast/Any noise.
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnknownParameterType = "error"
reportPrivateUsage = "error"
reportDeprecated = "error"
reportUnusedFunction = "error"
reportUnusedVariable = "error"
reportUnusedImport = "error"
reportUnusedExpression = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryIsInstance = "error"
reportConstantRedefinition = "error"
reportIncompatibleMethodOverride = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedBaseClass = "error"
reportUntypedNamedTuple = "error"
reportTypeCommentUsage = "error"
reportInvalidStubStatement = "error"
reportSelfClsParameterName = "error"
# Off: strict's Unknown-propagation family. Those findings come from
# json.load/psutil/Popen returning Any; removing them needs TypedDicts and casts
# across core JSON handling, and mypy --strict already covers that ground.
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownLambdaType = "none"
# rarfile ships no py.typed marker and no stub package exists on PyPI
# (same reason as the mypy override above).
reportMissingTypeStubs = "none"

[tool.pylint.main]
load-plugins = ["pylint_pytest"]
source-roots = ["src", "tests"]
# workspace.py imports msvcrt under a sys.platform == "win32" guard (Windows-only).
ignored-modules = ["msvcrt"]

# Raised over the pylint defaults, never disabled: each limit is the smallest
# value the current code needs, with the function or class that drives it.
[tool.pylint.design]
max-args = 11                # services.install_from_archive: its keyword list is
                             # the InstallFromArchiveRequest schema
max-positional-arguments = 9 # test_profile: nine fixtures in one test signature
max-locals = 27              # services._apply_update
max-attributes = 27          # forge.client.ForgeMod: one attribute per API field
max-returns = 9              # modmeta._token_matches
min-public-methods = 0       # frozen dataclasses and Protocols have none

[tool.pylint.similarities]
# The pydantic request/response models mirror the core dataclasses field for
# field -- that duplication is the API contract (forge.catalog.CatalogMod and
# schemas.CatalogMod share 23 lines) and a schema-parity test enforces it.
min-similarity-lines = 24

[tool.pylint.format]
max-line-length = 119
max-module-lines = 4000      # core/services.py (3480 lines) until it is split

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pylint>=4.0.8",
    "pylint-pytest>=1.1.8",
    "pyright[nodejs]>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
    "types-psutil>=7.2.2.20260827",
]

[tool.coverage.run]
branch = true
source = ["sptmod"]

[tool.coverage.report]
# Only two exclusion classes are allowed in this project: platform-specific
# branches that cannot execute on Linux and static-typing-only imports.
exclude_also = [
    'if sys\.platform == "win32":',
    "if TYPE_CHECKING:",
]
fail_under = 100
show_missing = true
